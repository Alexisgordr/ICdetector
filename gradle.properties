# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Reducir ruido en el terminal (Jetifier ya no es necesario en proyectos modernos de Compose)
android.enableJetifier=false

kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true

# Configuraciones para mejorar el rendimiento y limpiar avisos de AGP 9.0+
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.dependency.useConstraints=true

# Configuration cache: reuses the build configuration between runs (faster builds).
# "warn" keeps the build working if a plugin is not compatible yet; it only reports it.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
